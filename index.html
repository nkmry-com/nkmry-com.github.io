<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>トップページ</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding: 24px 16px;
            font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
            background: #f4f6fa;
            color: #222;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            width: 100%;
            max-width: 720px;
        }

        .card {
            flex: 1 1 280px;
            padding: 32px 24px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .card:hover,
        .card:focus-visible {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 1.3rem;
        }

        .card p {
            margin: 0;
            color: #667;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <h1>移動先を選択してください</h1>
    <div class="cards">
        <a class="card" href="https://nkmry.com/">
            <h2>個人HP</h2>
            <p>nkmry.com</p>
        </a>
        <a class="card" href="https://nakayuu.nkmr.io/">
            <h2>研究HP</h2>
            <p>nakayuu.nkmr.io</p>
        </a>
    </div>
</body>

</html>
